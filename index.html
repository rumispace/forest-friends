<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#bfe6ff">
<title>숲속 친구들 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
</head>
<body>
<div id="app"></div>

<!-- 정보창 -->
<div id="hud">
  <div class="left">
    <canvas id="mini"></canvas>
    <div id="lvl" class="pill"><span id="lvlText">탐험가 Lv.1</span><span id="stars"></span></div>
    <div id="gems" class="pill"></div>
  </div>
  <div class="right">
    <button id="timeBtn" class="round" hidden>🌙</button>
    <button id="bookBtn" class="round">📖</button>
  </div>
  <button id="gear" title="부모용: 1초 꾹">⚙️</button>
</div>

<!-- 미션 카드: 톡 하면 데려다준다 -->
<button id="mission" class="hide">
  <span id="mIcon">🐿️</span>
  <span class="mBody"><span id="mStep">미션 1/6</span><span id="mText"></span></span>
  <span class="mGo">👣<small>데려다줘</small></span>
</button>

<!-- 이야기 말상자 (톡 하면 다음) -->
<div id="talk" class="hide">
  <div id="talkIcon">📖</div>
  <div class="talkBody"><div id="talkName"></div><div id="talkText"></div></div>
  <div class="talkNext">▶</div>
</div>

<!-- 끌어서 걷기 조이스틱 -->
<div id="joy" class="hide"><div id="joyKnob"></div></div>

<!-- 장수풍뎅이 힘겨루기 -->
<div id="sumo" class="overlay hide">
  <div class="panel sumoPanel">
    <h2>💪 힘겨루기! <span id="sumoTime">15</span></h2>
    <canvas id="sumoCanvas"></canvas>
    <div class="sumoBarWrap"><div id="sumoBar"></div></div>
    <p>🪲 장수풍뎅이를 응원해요! 아무 데나 <b>톡톡톡</b></p>
  </div>
</div>

<!-- 골디 말풍선 -->
<div id="msg" class="hide"><span class="who">🐶</span><span id="msgText"></span></div>

<!-- 꾹 누르기 고리 -->
<svg id="ring" class="hide" viewBox="0 0 100 100">
  <circle class="bg" cx="50" cy="50" r="40"/>
  <circle id="ringFg" class="fg" cx="50" cy="50" r="40"/>
  <text x="50" y="60" text-anchor="middle">🔍</text>
</svg>

<!-- 친구 카드 -->
<div id="card" class="overlay hide">
  <div class="panel cardPanel">
    <div class="art">
      <div id="cardRibbon" class="ribbon">새 친구를 만났어요!</div>
      <canvas id="cardCanvas"></canvas>
    </div>
    <div class="info">
      <h2 id="cardName"></h2>
      <ol id="cardFacts"></ol>
      <div class="btns">
        <button id="cardSpeak" class="btn ghost">🔊 다시 듣기</button>
        <button id="cardClose" class="btn">💚 놓아주기</button>
      </div>
    </div>
  </div>
</div>

<!-- 아이템 / 이벤트 카드 -->
<div id="item" class="overlay hide">
  <div class="panel itemPanel">
    <div id="itemIcon" class="itemIcon">🔦</div>
    <h2 id="itemTitle"></h2>
    <p id="itemText"></p>
    <button id="itemClose" class="btn">좋아요!</button>
  </div>
</div>

<!-- 도감 -->
<div id="book" class="overlay hide">
  <div class="panel bookPanel">
    <h2>📖 숲속 친구 도감</h2>
    <div id="bookGrid"></div>
    <button id="bookClose" class="btn">닫기</button>
  </div>
</div>

<!-- 부모용 설정 -->
<div id="settings" class="overlay hide">
  <div class="panel itemPanel">
    <h2>⚙️ 부모용 설정</h2>
    <div class="setRow"><button id="setVoice" class="btn ghost"></button></div>
    <div class="setRow"><button id="setSound" class="btn ghost"></button></div>
    <div class="setRow"><button id="setReset" class="btn danger">처음부터 다시</button></div>
    <button id="setClose" class="btn">닫기</button>
  </div>
</div>

<!-- 시작 화면 -->
<div id="title" class="overlay">
  <div class="titleBox">
    <div class="titleEmoji">🪲 🐕 🐿️</div>
    <h1>숲속 친구들<br>탐험대</h1>
    <button id="startBtn" class="btn big">▶ 탐험 시작!</button>
    <p class="sub">소리를 켜 주세요 🔊</p>
  </div>
</div>

<script>
// 새 버전 자동 받기: version.json 의 번호로 파일을 불러온다.
// 앱으로 다시 돌아왔을 때 번호가 바뀌었으면 새로고침 (진행은 기기에 저장돼 있어 그대로)
(async () => {
  const ver = async () => (await (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' })).json()).v;
  let v = 'dev'; try { v = await ver(); } catch (e) {}
  window.GAME_VER = v;
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'style.css?v=' + v; document.head.appendChild(l);
  const s = document.createElement('script'); s.type = 'module'; s.src = 'game.js?v=' + v; document.body.appendChild(s);
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible') return;
    try { if ((await ver()) !== window.GAME_VER) location.reload(); } catch (e) {}
  });
})();
</script>
</body>
</html>
